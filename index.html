<script>
  // Aplica el tema antes de pintar para evitar parpadeo
  try { const p = JSON.parse(localStorage.getItem('USAR_V4_PREFS') || '{}'), t = p.theme, r = document.documentElement;
    r.dataset.theme = t === 'sun' ? 'light' : t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    if (t === 'sun') r.dataset.sun = '1'; if (p.big) r.classList.add('big'); } catch {}
</script>
